<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fa99a">
<title>TwinCare 🌿</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#f4f0e8;color:#38433e;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}
.app{max-width:560px;margin:auto;padding-bottom:40px}
header{
display:flex;justify-content:space-between;align-items:center;
padding:20px 18px 10px
}
.logo{font-size:27px;font-weight:750}
.iconbtn,.arrow,.datebtn{
border:0;background:none;color:#52635a
}
.iconbtn{font-size:21px}
.arrow{font-size:28px}
.datebar{
display:flex;justify-content:space-between;
align-items:center;padding:0 15px 15px
}
.datebtn{font-weight:700;font-size:15px}

.tabs{
display:flex;gap:7px;padding:0 14px 14px;
overflow-x:auto
}
.tab{
white-space:nowrap;border:1px solid #d8ddd8;
background:#fbfaf6;border-radius:13px;
padding:10px;color:#65716b
}
.tab.active{
background:#dfe9e1;border-color:#91aa9b;font-weight:700
}

.screen{display:none;padding:0 16px}
.screen.active{display:block}

.children{display:flex;gap:8px;margin-bottom:14px}
.child{
flex:1;padding:12px;border-radius:15px;
border:1px solid #d8ddd8;background:#fbfaf6;
font-weight:700;color:#52605a
}
.child.active{
background:#dfe9e1;border-color:#91aa9b
}

.grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}

.metric,.card{
background:#fbfaf6;border:1px solid #e5e0d7;
border-radius:17px;padding:15px;margin-bottom:12px
}
.metric{background:#e8eee9}
.metric strong{
display:block;font-size:23px;margin-top:4px
}

.small{font-size:12px;color:#7b837e}

.primary,.secondary{
border:0;border-radius:12px;padding:12px 14px;
font-weight:700;font-size:14px
}
.primary{background:#8fa99a;color:white}
.secondary{background:#e7ece8;color:#52635a}
.full{width:100%}

h1{font-size:23px;margin:0}
h2{font-size:17px;margin:0 0 12px}

.title{
display:flex;justify-content:space-between;
align-items:center;margin:3px 0 14px
}

.feed{
display:grid;grid-template-columns:60px 1fr auto;
gap:10px;align-items:center;padding:12px 0;
border-bottom:1px solid #eee9e0
}
.feed:last-child{border:0}
.time{font-weight:750}
.amount{font-size:17px;font-weight:750}

label{
display:block;font-size:13px;
font-weight:650;margin:10px 0
}

input,select{
width:100%;display:block;margin-top:6px;
padding:11px;border:1px solid #d7ddd8;
border-radius:10px;background:white;
font:inherit;color:#38433e
}

.row{
display:grid;grid-template-columns:1fr 1fr;gap:9px
}

.checks{display:flex;gap:8px}
.checks label{
background:#eef2ee;padding:10px;
border-radius:10px;flex:1
}
.checks input{
width:auto;display:inline;margin:0 5px 0 0
}

.task{
display:flex;gap:10px;align-items:center;
padding:10px 0;border-bottom:1px solid #eee9e0
}
.task input{width:20px;margin:0}

.event{
border-left:4px solid #8fa99a;
padding:12px 14px;background:#fbfaf6;
border-radius:10px;margin-bottom:9px
}

.empty{
text-align:center;color:#8a918d;padding:18px
}

.delete{
border:0;background:none;color:#9a746d
}

.chart{
height:220px;width:100%;
background:white;border-radius:12px
}

.modal{
border:0;border-radius:20px;padding:20px;
width:min(92%,430px);background:#fbfaf6;
color:#38433e
}
.modal::backdrop{background:#25302977}
.modalhead{
display:flex;justify-content:space-between
}
.close{
border:0;background:none;font-size:24px
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">TwinCare 🌿</div>
<button class="iconbtn" id="settings">⚙️</button>
</header>

<div class="datebar">
<button class="arrow" id="prev">‹</button>
<button class="datebtn" id="dateBtn"></button>
<button class="arrow" id="next">›</button>
<input id="datePick" type="date" hidden>
</div>

<div class="tabs">
<button class="tab active" data-screen="care">🍼 Opieka</button>
<button class="tab" data-screen="growth">📈 Waga i wzrost</button>
<button class="tab" data-screen="hygiene">🧴 Pielęgnacja</button>
<button class="tab" data-screen="calendar">📅 Kalendarz</button>
</div>

<section id="care" class="screen active">

<div class="children">
<button class="child active" data-child="0">
👶 <span></span>
</button>
<button class="child" data-child="1">
👶 <span></span>
</button>
</div>

<div class="grid" id="summary"></div>

<button class="primary full" id="addFeed">
＋ Dodaj karmienie
</button>

<div class="card" style="margin-top:12px">
<h2>Historia dnia</h2>
<div id="feedList"></div>
</div>

</section>


<section id="growth" class="screen">

<div class="title">
<div>
<h1>Waga i wzrost</h1>
<div class="small childName"></div>
</div>

<button class="primary" id="addMeasure">
＋ Pomiar
</button>
</div>

<div class="card">
<h2>Wykres wagi</h2>
<div id="chart"></div>
</div>

<div class="card">
<h2>Historia pomiarów</h2>
<div id="measureList"></div>
</div>

</section>


<section id="hygiene" class="screen">

<div class="title">
<div>
<h1>Pielęgnacja</h1>
<div class="small childName"></div>
</div>
</div>

<div class="card">
<h2>Pielęgnacja</h2>
<div id="careTasks"></div>
<button class="secondary full" id="newCare">
＋ Dodaj czynność
</button>
</div>

<div class="card">
<h2>Leki i suplementy</h2>
<div id="medTasks"></div>
<button class="secondary full" id="newMed">
＋ Dodaj lek / suplement
</button>
</div>

</section>


<section id="calendar" class="screen">

<div class="title">
<div>
<h1>Kalendarz</h1>
<div class="small">
Wizyty i ważne wydarzenia
</div>
</div>

<button class="primary" id="newEvent">
＋ Wydarzenie
</button>
</div>

<div id="eventList"></div>

</section>

</div>


<dialog id="feedModal" class="modal">

<div class="modalhead">
<h2>Dodaj karmienie</h2>
<button class="close" data-close="feedModal">×</button>
</div>

<label>
Godzina
<input id="feedTime" type="time">
</label>

<label>
Ilość (ml)
<input id="feedAmount" type="number" min="0" step="5" value="90">
</label>

<label>
Sposób karmienia

<select id="feedMethod">
<option>Mleko modyfikowane</option>
<option>Pierś</option>
<option>Odciągane mleko</option>
</select>

</label>

<div class="checks">

<label>
<input id="feedPee" type="checkbox">
💧 Siku
</label>

<label>
<input id="feedPoop" type="checkbox">
💩 Kupa
</label>

</div>

<button class="primary full" id="saveFeed">
Zapisz karmienie
</button>

</dialog>


<dialog id="measureModal" class="modal">

<div class="modalhead">
<h2>Dodaj pomiar</h2>
<button class="close" data-close="measureModal">×</button>
</div>

<label>
Data
<input id="measureDate" type="date">
</label>

<div class="row">

<label>
Waga (kg)
<input id="weight" type="number" step=".01">
</label>

<label>
Wzrost (cm)
<input id="height" type="number" step=".1">
</label>

</div>

<button class="primary full" id="saveMeasure">
Zapisz pomiar
</button>

</dialog>


<dialog id="eventModal" class="modal">

<div class="modalhead">
<h2>Dodaj wydarzenie</h2>
<button class="close" data-close="eventModal">×</button>
</div>

<label>
Data
<input id="eventDate" type="date">
</label>

<label>
Godzina
<input id="eventTime" type="time">
</label>

<label>
Nazwa
<input id="eventName" placeholder="np. Pediatra">
</label>

<button class="primary full" id="saveEvent">
Zapisz wydarzenie
</button>

</dialog>


<dialog id="settingsModal" class="modal">

<div class="modalhead">
<h2>Profile bliźniąt</h2>
<button class="close" data-close="settingsModal">×</button>
</div>

<label>
Imię pierwszego dziecka
<input id="name0">
</label>

<label>
Imię drugiego dziecka
<input id="name1">
</label>

<button class="primary full" id="saveNames">
Zapisz imiona
</button>

</dialog>


<script>

const STORAGE = "twincare_v2";

let state =
JSON.parse(localStorage.getItem(STORAGE) || "null") || {
names:["Bliźniak 1","Bliźniak 2"],
feeds:{},
measurements:[[],[]],
tasks:[[],[]],
meds:[[],[]],
events:[]
};

let child = 0;

let selectedDate =
new Date().toISOString().slice(0,10);

const $ = id =>
document.getElementById(id);

function save(){
localStorage.setItem(
STORAGE,
JSON.stringify(state)
);
}

function dayKey(){
return selectedDate + "_" + child;
}

function prettyDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString("pl-PL",{
day:"numeric",
month:"long",
year:"numeric"
});

}


function renderNames(){

document
.querySelectorAll(".child span")
.forEach((el,i)=>{
el.textContent = state.names[i];
});

document
.querySelectorAll(".child")
.forEach((el,i)=>{
el.classList.toggle(
"active",
i === child
);
});

document
.querySelectorAll(".childName")
.forEach(el=>{
el.textContent = state.names[child];
});

}


function renderCare(){

const feeds =
state.feeds[dayKey()] || [];

let total = 0;
let pee = 0;
let poop = 0;

feeds.forEach(feed=>{

total += Number(feed.amount);

if(feed.pee) pee++;
if(feed.poop) poop++;

});

const average =
feeds.length
? Math.round(total / feeds.length)
: 0;

$("summary").innerHTML = `

<div class="metric">
🍼
<strong>${total} ml</strong>
<span class="small">${feeds.length} karmień</span>
</div>

<div class="metric">
⌀
<strong>${average} ml</strong>
<span class="small">średnio</span>
</div>

<div class="metric">
💧
<strong>${pee}</strong>
<span class="small">siku</span>
</div>

<div class="metric">
💩
<strong>${poop}</strong>
<span class="small">kupy</span>
</div>

`;

if(!feeds.length){

$("feedList").innerHTML =
'<div class="empty">Brak zapisów tego dnia.</div>';

return;

}

$("feedList").innerHTML =
feeds
.slice()
.reverse()
.map(feed=>`

<div class="feed">

<div class="time">
${feed.time}
</div>

<div>

<div class="amount">
${feed.amount} ml
</div>

<div class="small">
${feed.method}
</div>

</div>

<div>
${feed.pee ? "💧" : ""}
${feed.poop ? "💩" : ""}
</div>

</div>

`)
.join("");

}


function renderGrowth(){

const list =
state.measurements[child]
.slice()
.sort((a,b)=>
a.date.localeCompare(b.date)
);

if(!list.length){

$("measureList").innerHTML =
'<div class="empty">Brak pomiarów.</div>';

$("chart").innerHTML =
'<div class="empty">Wykres pojawi się po dodaniu pomiarów.</div>';

return;

}

$("measureList").innerHTML =
list
.slice()
.reverse()
.map(item=>`

<div class="task">

<span>
${prettyDate(item.date)}
</span>

<strong style="margin-left:auto">

${item.weight
? item.weight+" kg"
: ""}

${item.height
? " • "+item.height+" cm"
: ""}

</strong>

</div>

`)
.join("");


const weights =
list.map(x=>Number(x.weight)||0);

const valid =
weights.filter(Boolean);

if(!valid.length){

$("chart").innerHTML =
'<div class="empty">Dodaj wagę, aby zobaczyć wykres.</div>';

return;

}

const max =
Math.max(...valid);

const min =
Math.min(...valid);

const points =
list.map((item,index)=>{

const value =
Number(item.weight)||min;

const x =
list.length === 1
? 50
: 5 + index/(list.length-1)*90;

const y =
90 -
((value-min)/(max-min || 1))*70;

return `${x},${y}`;

}).join(" ");

$("chart").innerHTML = `

<svg
viewBox="0 0 100 100"
width="100%"
height="200"
preserveAspectRatio="none">

<line
x1="5"
y1="90"
x2="95"
y2="90"
stroke="#ddd"/>

<line
x1="5"
y1="20"
x2="5"
y2="90"
stroke="#ddd"/>

<polyline
points="${points}"
fill="none"
stroke="#8fa99a"
stroke-width="2"/>

</svg>

<div class="small">
Zmiana wagi w kolejnych pomiarach
</div>

`;

}


function taskHTML(list,type){

if(!list.length){

return '<div class="empty">Brak pozycji.</div>';

}

return list.map((item,index)=>`

<div class="task">

<input
type="checkbox"
data-task="${type}"
data-index="${index}"
${item.done ? "checked" : ""}>

<span>
${item.name}
</span>

</div>

`).join("");

}


function renderTasks(){

$("careTasks").innerHTML =
taskHTML(
state.tasks[child],
"care"
);

$("medTasks").innerHTML =
taskHTML(
state.meds[child],
"med"
);

}


function renderEvents(){

const events =
state.events
.slice()
.sort((a,b)=>
(a.date+a.time)
.localeCompare(b.date+b.time)
);

if(!events.length){

$("eventList").innerHTML =
'<div class="empty">Brak wydarzeń.</div>';

return;

}

$("eventList").innerHTML =
events.map((event,index)=>`

<div class="event">

<strong>
${event.name}
</strong>

<div class="small">

${prettyDate(event.date)}

${event.time
? " • "+event.time
: ""}

</div>

<button
class="delete"
data-event="${index}">
Usuń
</button>

</div>

`).join("");

}


function render(){

$("dateBtn").textContent =
prettyDate(selectedDate);

renderNames();
renderCare();
renderGrowth();
renderTasks();
renderEvents();

}


document
.querySelectorAll(".tab")
.forEach(button=>{

button.onclick = ()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

document
.querySelectorAll(".screen")
.forEach(x=>
x.classList.remove("active")
);

$(button.dataset.screen)
.classList.add("active");

};

});


document
.querySelectorAll(".child")
.forEach(button=>{

button.onclick = ()=>{

child =
Number(button.dataset.child);

render();

};

});


$("prev").onclick = ()=>{

const date =
new Date(selectedDate+"T12:00:00");

date.setDate(
date.getDate()-1
);

selectedDate =
date.toISOString().slice(0,10);

render();

};


$("next").onclick = ()=>{

const date =
new Date(selectedDate+"T12:00:00");

date.setDate(
date.getDate()+1
);

selectedDate =
date.toISOString().slice(0,10);

render();

};


$("dateBtn").onclick = ()=>{

$("datePick").value =
selectedDate;

$("datePick").showPicker
? $("datePick").showPicker()
: $("datePick").click();

};


$("datePick").onchange = event=>{

selectedDate =
event.target.value;

render();

};


$("addFeed").onclick = ()=>{

$("feedTime").value =
new Date()
.toTimeString()
.slice(0,5);

$("feedModal").showModal();

};


$("saveFeed").onclick = ()=>{

const key =
dayKey();

if(!state.feeds[key]){
state.feeds[key] = [];
}

state.feeds[key].push({

time:$("feedTime").value,

amount:Number(
$("feedAmount").value
),

method:
$("feedMethod").value,

pee:
$("feedPee").checked,

poop:
$("feedPoop").checked

});

save();

$("feedModal").close();

$("feedPee").checked = false;
$("feedPoop").checked = false;

render();

};


$("addMeasure").onclick = ()=>{

$("measureDate").value =
selectedDate;

$("measureModal").showModal();

};


$("saveMeasure").onclick = ()=>{

if(
!$("weight").value &&
!$("height").value
){
return;
}

state.measurements[child].push({

date:$("measureDate").value,

weight:$("weight").value,

height:$("height").value

});

save();

$("measureModal").close();

$("weight").value = "";
$("height").value = "";

render();

};


function addTask(type){

const name =
prompt(
type === "care"
? "Nazwa czynności:"
: "Nazwa leku lub suplementu:"
);

if(!name) return;

const list =
type === "care"
? state.tasks[child]
: state.meds[child];

list.push({
name:name,
done:false
});

save();
render();

}


$("newCare").onclick =
()=>addTask("care");

$("newMed").onclick =
()=>addTask("med");


document.addEventListener(
"change",
event=>{

if(!event.target.dataset.task)
return;

const list =
event.target.dataset.task === "care"
? state.tasks[child]
: state.meds[child];

const index =
Number(
event.target.dataset.index
);

list[index].done =
event.target.checked;

save();

});


$("newEvent").onclick = ()=>{

$("eventDate").value =
selectedDate;

$("eventModal").showModal();

};


$("saveEvent").onclick = ()=>{

const name =
$("eventName").value.trim();

if(!name) return;

state.events.push({

date:$("eventDate").value,

time:$("eventTime").value,

name:name

});

save();

$("eventModal").close();

$("eventName").value = "";
$("eventTime").value = "";

render();

};


$("settings").onclick = ()=>{

$("name0").value =
state.names[0];

$("name1").value =
state.names[1];

$("settingsModal").showModal();

};


$("saveNames").onclick = ()=>{

state.names = [

$("name0").value.trim()
|| "Bliźniak 1",

$("name1").value.trim()
|| "Bliźniak 2"

];

save();

$("settingsModal").close();

render();

};


document
.querySelectorAll("[data-close]")
.forEach(button=>{

button.onclick = ()=>{

$(button.dataset.close)
.close();

};

});


render();

</script>

</body>
</html>
